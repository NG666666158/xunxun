<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>快速搜索 · 寻寻</title>
  <link rel="stylesheet" href="app.css">
  <style>
    html, body { height: 100%; }
    body { margin: 0; overflow: hidden; background: var(--bg); }
    .quick { height: 100%; display: flex; flex-direction: column; box-sizing: border-box; background: var(--bg); }
    .quick-head { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--sep); }
    .quick-head .mascot { width: 30px; height: 30px; }
    .quick-head input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 20px; color: var(--label); }
    .quick-head input::placeholder { color: var(--label-4); }
    .quick-list { margin: 0; padding: 6px; overflow-y: auto; flex: 1; }
    .quick-list .frows { border: 0; padding: 0; background: transparent; box-shadow: none; }
    .quick-list .frows-more { margin: 4px 0 2px 6px; }
    .quick-empty { flex: 1; display: grid; place-items: center; padding: 16px; color: var(--label-3); font-size: 13.5px; text-align: center; }
    .quick-foot { display: flex; gap: 16px; padding: 8px 18px; border-top: 1px solid var(--sep); font-size: 11.5px; color: var(--label-3); background: var(--bg-grouped); }
    .quick-foot span { display: inline-flex; align-items: center; gap: 4px; }
  </style>
</head>
<body>
  <div class="quick" id="quick">
    <div class="quick-head">
      <span id="pet"></span>
      <input id="q" type="search" placeholder="让寻寻找文件：主题、文件名、“上周加的 PDF”…" spellcheck="false" autocomplete="off" autofocus aria-label="找文件">
    </div>
    <div class="quick-list" id="list"></div>
    <div class="quick-empty" id="empty">输入关键词，按文件名和内容找</div>
    <div class="quick-foot">
      <span><kbd>↑</kbd><kbd>↓</kbd> 选择</span>
      <span><kbd>Enter</kbd> 看原文</span>
      <span><kbd>Ctrl</kbd>+<kbd>Enter</kbd> 用默认程序打开</span>
      <span><kbd>Esc</kbd> 关闭</span>
    </div>
  </div>
  <script src="icons.js"></script>
  <script src="filerow.js"></script>
  <script src="quick.js"></script>
</body>
</html>
