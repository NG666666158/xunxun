name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    # The app ships for Windows only; Ubuntu stays because the backend must not depend on it.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install dependencies
        run: python -m pip install -r requirements-lock.txt

      - name: Check the version is the same everywhere
        run: python scripts/bump_version.py

      - name: Run unit tests
        run: python -m pytest project/tests -q --ignore=project/tests/smoke

      - name: Run the offline retrieval evaluation
        # evaluation/suite/ci_tier.py: index build, retrieval and metrics on a fixed slice
        # from cached model outputs; no network and no key. Fails when a result moves.
        run: python -I evaluation/suite/ci_tier.py check

      - name: Run JavaScript tests
        # File by file: `node --test <directory>` does not work on every Node version.
        run: for test in project/tests/js/*.cjs; do node --test "$test" || exit 1; done

  dependency-audit:
    # Known vulnerabilities in the pinned Python packages: users import arbitrary PDF, Word,
    # Excel and image files. Fails on any; to accept one for now, add its ID and the reason
    # to .github/pip-audit-ignore.txt. Same command locally: scripts/audit_deps.py.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install pip-audit
        run: python -m pip install pip-audit==2.10.1

      - name: Audit requirements-lock.txt
        run: python scripts/audit_deps.py --desc

  browser-smoke:
    # Guided start, add a file, ask, open the preview: real backend, fake model service, no key.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install playwright==1.64.1
          python -m playwright install --with-deps chromium

      - name: Run the browser smoke test
        run: python -m pytest project/tests/smoke -q

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build application image
        run: docker compose build app
